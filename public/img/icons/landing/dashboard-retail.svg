<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" width="1500" height="1050" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <filter id="softshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0A1220" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A1220" flood-opacity="0.28"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="1500" height="1050" fill="#F4F6FA"/>

  <!-- tarjeta principal -->
  <rect x="95" y="40" width="1310" height="950" rx="34" fill="url(#cardbg)" filter="url(#softshadow)"/>

  <!-- ================= HEADER ================= -->
  <!-- icono carrito rojo -->
  <g transform="translate(140,80)" stroke="#E63946" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h10l10 44h34l8-30H16"/>
    <circle cx="26" cy="60" r="5" fill="#E63946" stroke="none"/>
    <circle cx="52" cy="60" r="5" fill="#E63946" stroke="none"/>
  </g>
  <text x="235" y="122" fill="#FFFFFF" font-size="34" font-weight="700">Retail <tspan fill="#8A97AB">•</tspan> Live Dashboard</text>

  <!-- badge OPERATIVO -->
  <rect x="965" y="82" width="190" height="54" rx="27" fill="none" stroke="#2EC4B6" stroke-width="2"/>
  <text x="1060" y="117" fill="#2EC4B6" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">OPERATIVO</text>

  <!-- badge ISO 9001 -->
  <rect x="1175" y="82" width="180" height="54" rx="27" fill="none" stroke="#E63946" stroke-width="2"/>
  <g transform="translate(1200,97)" fill="#E63946">
    <path d="M12.6 8.6a4.7 4.7 0 0 0 0-1.2l1.3-1a.33.33 0 0 0 .08-.42l-1.26-2.18a.33.33 0 0 0-.4-.15l-1.57.63a4.8 4.8 0 0 0-1.07-.62l-.24-1.67a.33.33 0 0 0-.33-.28H6.6a.33.33 0 0 0-.33.28l-.24 1.67c-.39.16-.74.37-1.07.62l-1.57-.63a.33.33 0 0 0-.4.15L1.73 6a.33.33 0 0 0 .08.42l1.33 1a4.7 4.7 0 0 0 0 1.24l-1.33 1a.33.33 0 0 0-.08.42l1.26 2.18c.09.15.26.21.4.15l1.57-.63c.33.25.68.46 1.07.62l.24 1.67c.03.16.16.28.33.28h2.52c.16 0 .3-.12.33-.28l.24-1.67c.39-.16.74-.37 1.07-.62l1.57.63c.14.06.31 0 .4-.15l1.26-2.18a.33.33 0 0 0-.08-.42l-1.33-1zM7.9 10.2a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z" transform="scale(1.55)"/>
  </g>
  <text x="1240" y="118" fill="#FFFFFF" font-size="23" font-weight="700">ISO 9001</text>

  <!-- separador -->
  <line x1="95" y1="170" x2="1405" y2="170" stroke="#1B2A40" stroke-width="1.5"/>

  <!-- ================= GRAFICA ================= -->
  <text x="140" y="222" fill="#B9C2CF" font-size="24">Ventas en tiempo real</text>
  <polyline points="140,286 190,262 230,278 275,290 320,272 370,280 430,268 480,282 520,252 560,270 610,244 660,262 700,258 760,266 810,248 855,232"
            fill="none" stroke="#E63946" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="855" cy="232" r="9" fill="#E63946" filter="url(#glow)"/>

  <line x1="95" y1="320" x2="1405" y2="320" stroke="#1B2A40" stroke-width="1.5"/>

  <!-- ================= TARJETAS DE METRICAS ================= -->
  <!-- tarjeta 1: ventas -->
  <rect x="140" y="352" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(178,398)" stroke="#2EC4B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4h8l8 36h28l7-25H13"/>
    <circle cx="20" cy="50" r="4.2" fill="#2EC4B6" stroke="none"/>
    <circle cx="42" cy="50" r="4.2" fill="#2EC4B6" stroke="none"/>
  </g>
  <text x="270" y="425" fill="#FFFFFF" font-size="46" font-weight="800">342</text>
  <text x="270" y="465" fill="#E6EAF0" font-size="26" font-weight="600">Ventas del día</text>
  <text x="270" y="500" fill="#8A97AB" font-size="22">Tickets emitidos</text>

  <!-- tarjeta 2: DTE -->
  <rect x="770" y="352" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(808,392)" stroke="#2EC4B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 2H10a5 5 0 0 0-5 5v46a5 5 0 0 0 5 5h30a5 5 0 0 0 5-5V13L34 2z"/>
    <path d="M34 2v11h11"/>
    <path d="M14 30l7 7 13-13"/>
  </g>
  <text x="900" y="425" fill="#FFFFFF" font-size="46" font-weight="800">296</text>
  <text x="900" y="465" fill="#E6EAF0" font-size="26" font-weight="600">DTE emitidos hoy</text>
  <text x="900" y="500" fill="#8A97AB" font-size="22">Transmitidos a Hacienda</text>

  <!-- tarjeta 3: inventario -->
  <rect x="140" y="565" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(178,608)" stroke="#2EC4B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 2 52 14v28L28 54 4 42V14L28 2z"/>
    <path d="M4 14l24 12 24-12M28 26v28"/>
    <path d="M16 8l24 12" />
  </g>
  <text x="270" y="638" fill="#FFFFFF" font-size="46" font-weight="800">3,480</text>
  <text x="270" y="678" fill="#E6EAF0" font-size="26" font-weight="600">Productos en inventario</text>
  <text x="270" y="713" fill="#8A97AB" font-size="22">Sincronizado en tiempo real</text>

  <!-- tarjeta 4: sucursales -->
  <rect x="770" y="565" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(806,606)" fill="#2EC4B6">
    <path d="M30 2c-9.4 0-17 7.6-17 17 0 12.8 17 33 17 33s17-20.2 17-33c0-9.4-7.6-17-17-17zm0 23a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/>
  </g>
  <text x="900" y="638" fill="#FFFFFF" font-size="46" font-weight="800">4</text>
  <text x="900" y="678" fill="#E6EAF0" font-size="26" font-weight="600">Sucursales activas</text>
  <text x="900" y="713" fill="#8A97AB" font-size="22">Conectadas al POS central</text>

  <!-- ================= TARJETA DESTACADA (venta en curso) ================= -->
  <!-- boton EFECTIVO -->
  <rect x="245" y="810" width="295" height="96" rx="20" fill="#13233A" stroke="#22334E" stroke-width="1.5"/>
  <g transform="translate(340,836)" stroke="#B9C2CF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="6" width="44" height="30" rx="5"/>
    <circle cx="22" cy="21" r="7.5"/>
    <path d="M7 13h.1M37 29h.1" stroke-width="4.5"/>
  </g>
  <text x="405" y="871" fill="#E6EAF0" font-size="27" font-weight="700">Efectivo</text>

  <!-- boton TRANSFERENCIA -->
  <rect x="565" y="810" width="360" height="96" rx="20" fill="#13233A" stroke="#22334E" stroke-width="1.5"/>
  <g transform="translate(612,834)" stroke="#B9C2CF" stroke-width="3.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="32 4 42 13 8 13"/>
    <polyline points="12 42 2 33 36 33"/>
  </g>
  <text x="680" y="871" fill="#E6EAF0" font-size="27" font-weight="700">Transferencia</text>

  <!-- boton TARJETA (destacado rojo, estilo Treming) -->
  <rect x="950" y="810" width="295" height="96" rx="20" fill="#E14434"/>
  <g transform="translate(1000,838)" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="44" height="32" rx="5"/>
    <path d="M0 13h44" stroke-width="6"/>
    <path d="M8 26h10" stroke-width="4.5"/>
  </g>
  <text x="1068" y="871" fill="#FFFFFF" font-size="27" font-weight="700">Tarjeta</text>

  <!-- ================= BADGES FLOTANTES ================= -->
  <!-- badge izquierdo -->
  <g filter="url(#badgeshadow)">
    <rect x="30" y="800" width="290" height="110" rx="26" fill="#0D1A2C" stroke="#E63946" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(58,826)" fill="none" stroke="#E63946" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="14 1 17.7 8.8 26 10 20 16 21.5 24.3 14 20.3 6.5 24.3 8 16 2 10 10.3 8.8"/>
  </g>
  <text x="98" y="848" fill="#FFFFFF" font-size="24" font-weight="700"><tspan fill="#E63946">Multi-sucursal</tspan> en</text>
  <text x="98" y="882" fill="#B9C2CF" font-size="22">tiempo real</text>

  <!-- badge derecho -->
  <g filter="url(#badgeshadow)">
    <rect x="1185" y="740" width="290" height="100" rx="26" fill="#0D1A2C" stroke="#E63946" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(1212,764)" fill="none" stroke="#E63946" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 1.5 22 5v7c0 6-4 10.3-9 12-5-1.7-9-6-9-12V5l9-3.5z"/>
    <path d="M9.2 12.5l2.6 2.6 5-5"/>
  </g>
  <text x="1250" y="782" fill="#FFFFFF" font-size="23" font-weight="700">DTE certificado</text>
  <text x="1250" y="812" fill="#B9C2CF" font-size="21">Ministerio de Hacienda</text>
</svg>
