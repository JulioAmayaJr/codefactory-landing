<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" width="1500" height="1050" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <filter id="softshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0A1220" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A1220" flood-opacity="0.28"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="1500" height="1050" fill="#F4F6FA"/>

  <!-- tarjeta principal -->
  <rect x="95" y="40" width="1310" height="950" rx="34" fill="url(#cardbg)" filter="url(#softshadow)"/>

  <!-- ================= HEADER ================= -->
  <!-- icono casa con martillo rojo -->
  <g transform="translate(138,74)" stroke="#E63946" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 28L32 8l26 20"/>
    <path d="M12 26v26h40V26"/>
    <g transform="translate(20,26) rotate(38 12 10)">
      <rect x="4" y="2" width="17" height="8" rx="2" fill="#E63946" stroke="none"/>
      <path d="M12 10v16" stroke-width="5"/>
    </g>
  </g>
  <text x="235" y="122" fill="#FFFFFF" font-size="34" font-weight="700">Ferretería <tspan fill="#8A97AB">•</tspan> Live Dashboard</text>

  <!-- badge OPERATIVO -->
  <rect x="965" y="82" width="190" height="54" rx="27" fill="none" stroke="#2EC4B6" stroke-width="2"/>
  <text x="1060" y="117" fill="#2EC4B6" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">OPERATIVO</text>

  <!-- badge ISO 9001 -->
  <rect x="1175" y="82" width="180" height="54" rx="27" fill="none" stroke="#E63946" stroke-width="2"/>
  <g transform="translate(1200,97)" fill="#E63946">
    <path d="M12.6 8.6a4.7 4.7 0 0 0 0-1.2l1.3-1a.33.33 0 0 0 .08-.42l-1.26-2.18a.33.33 0 0 0-.4-.15l-1.57.63a4.8 4.8 0 0 0-1.07-.62l-.24-1.67a.33.33 0 0 0-.33-.28H6.6a.33.33 0 0 0-.33.28l-.24 1.67c-.39.16-.74.37-1.07.62l-1.57-.63a.33.33 0 0 0-.4.15L1.73 6a.33.33 0 0 0 .08.42l1.33 1a4.7 4.7 0 0 0 0 1.24l-1.33 1a.33.33 0 0 0-.08.42l1.26 2.18c.09.15.26.21.4.15l1.57-.63c.33.25.68.46 1.07.62l.24 1.67c.03.16.16.28.33.28h2.52c.16 0 .3-.12.33-.28l.24-1.67c.39-.16.74-.37 1.07-.62l1.57.63c.14.06.31 0 .4-.15l1.26-2.18a.33.33 0 0 0-.08-.42l-1.33-1zM7.9 10.2a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z" transform="scale(1.55)"/>
  </g>
  <text x="1240" y="118" fill="#FFFFFF" font-size="23" font-weight="700">ISO 9001</text>

  <!-- separador -->
  <line x1="95" y1="170" x2="1405" y2="170" stroke="#1B2A40" stroke-width="1.5"/>

  <!-- ================= GRAFICA ================= -->
  <text x="140" y="222" fill="#B9C2CF" font-size="24">Actividad del día</text>
  <polyline points="140,278 195,258 235,274 285,288 335,268 390,276 445,272 500,278 545,240 590,268 640,258 690,272 740,262 790,252 840,244 880,230"
            fill="none" stroke="#E63946" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="880" cy="230" r="9" fill="#E63946" filter="url(#glow)"/>

  <line x1="95" y1="320" x2="1405" y2="320" stroke="#1B2A40" stroke-width="1.5"/>

  <!-- ================= TARJETAS DE METRICAS ================= -->
  <!-- tarjeta 1: ventas del dia -->
  <rect x="140" y="352" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(178,398)" stroke="#2EC4B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4h8l8 36h28l7-25H13"/>
    <circle cx="20" cy="50" r="4.2" fill="#2EC4B6" stroke="none"/>
    <circle cx="42" cy="50" r="4.2" fill="#2EC4B6" stroke="none"/>
  </g>
  <text x="270" y="425" fill="#FFFFFF" font-size="46" font-weight="800">128</text>
  <text x="270" y="465" fill="#E6EAF0" font-size="26" font-weight="600">Ventas del día</text>
  <text x="270" y="500" fill="#8A97AB" font-size="22">Transacciones realizadas</text>

  <!-- tarjeta 2: cotizaciones -->
  <rect x="770" y="352" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(810,390)" stroke="#2EC4B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="40" height="52" rx="5"/>
    <rect x="15" y="0" width="18" height="12" rx="3" fill="#0F1D31"/>
    <path d="M14 24h.2M22 24h14M14 36h.2M22 36h14M14 48h.2M22 48h14" stroke-width="4.2"/>
  </g>
  <text x="900" y="425" fill="#FFFFFF" font-size="46" font-weight="800">32</text>
  <text x="900" y="465" fill="#E6EAF0" font-size="26" font-weight="600">Cotizaciones hoy</text>
  <text x="900" y="500" fill="#8A97AB" font-size="22">Solicitudes atendidas</text>

  <!-- tarjeta 3: inventario -->
  <rect x="140" y="565" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(178,608)" stroke="#2EC4B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 2 52 14v28L28 54 4 42V14L28 2z"/>
    <path d="M4 14l24 12 24-12M28 26v28"/>
    <path d="M16 8l24 12"/>
  </g>
  <text x="270" y="638" fill="#FFFFFF" font-size="46" font-weight="800">1,256</text>
  <text x="270" y="678" fill="#E6EAF0" font-size="26" font-weight="600">Productos en inventario</text>
  <text x="270" y="713" fill="#8A97AB" font-size="22">Disponibles</text>

  <!-- tarjeta 4: clientes -->
  <rect x="770" y="565" width="590" height="185" rx="20" fill="#0F1D31" stroke="#1C2C44" stroke-width="1.5"/>
  <g transform="translate(806,606)" fill="#2EC4B6">
    <circle cx="27" cy="16" r="9"/>
    <path d="M11 50c0-8.5 7.2-14 16-14s16 5.5 16 14v2H11v-2z"/>
    <circle cx="8" cy="20" r="6.5"/>
    <path d="M-2 48c0-7 5.5-11.5 12.5-11.5 1.6 0 3.2.2 4.6.7A18.6 18.6 0 0 0 9.5 50H-2v-2z" transform="translate(2,0)"/>
    <circle cx="46" cy="20" r="6.5"/>
    <path d="M56 48c0-7-5.5-11.5-12.5-11.5-1.6 0-3.2.2-4.6.7A18.6 18.6 0 0 1 44.5 50H56v-2z"/>
  </g>
  <text x="900" y="638" fill="#FFFFFF" font-size="46" font-weight="800">7</text>
  <text x="900" y="678" fill="#E6EAF0" font-size="26" font-weight="600">Clientes atendidos</text>
  <text x="900" y="713" fill="#8A97AB" font-size="22">Hoy</text>

  <!-- ================= TARJETA DESTACADA: PRODUCTO ================= -->
  <rect x="245" y="785" width="950" height="180" rx="22" fill="#0D1A2C" stroke="#E63946" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- circulo con taladro -->
  <circle cx="335" cy="875" r="58" fill="#E63946" opacity="0.14"/>
  <g transform="translate(298,848)" stroke="#E63946" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="10" width="46" height="20" rx="5"/>
    <path d="M48 15h14v10H48"/>
    <path d="M14 30l-3 18h14l-2-18"/>
    <path d="M10 17h20" stroke-width="3.4"/>
  </g>
  <text x="430" y="836" fill="#FFFFFF" font-size="32" font-weight="700">Taladro Inalámbrico Bosch GSR 18V</text>
  <text x="430" y="878" fill="#B9C2CF" font-size="25">Código: <tspan fill="#E6EAF0">06019K3000</tspan> <tspan fill="#8A97AB">·</tspan> Stock: <tspan fill="#2EC4B6" font-weight="600">12 unidades</tspan></text>
  <text x="430" y="920" fill="#B9C2CF" font-size="25">Ubicación: <tspan fill="#2EC4B6" font-weight="600">Pasillo 3 • Estante B</tspan></text>
  <rect x="960" y="845" width="200" height="58" rx="29" fill="none" stroke="#2EC4B6" stroke-width="2"/>
  <text x="1060" y="883" fill="#2EC4B6" font-size="23" font-weight="800" text-anchor="middle" letter-spacing="1">EN STOCK</text>

  <!-- ================= BADGES FLOTANTES ================= -->
  <!-- badge izquierdo -->
  <g filter="url(#badgeshadow)">
    <rect x="30" y="800" width="290" height="115" rx="26" fill="#0D1A2C" stroke="#E63946" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(56,824)" fill="none" stroke="#E63946" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="14 1 17.7 8.8 26 10 20 16 21.5 24.3 14 20.3 6.5 24.3 8 16 2 10 10.3 8.8"/>
  </g>
  <text x="96" y="846" fill="#FFFFFF" font-size="24" font-weight="700"><tspan fill="#E63946">+20 años</tspan></text>
  <text x="56" y="880" fill="#B9C2CF" font-size="21">sirviendo a</text>
  <text x="56" y="906" fill="#B9C2CF" font-size="21">nuestros clientes</text>

  <!-- badge derecho -->
  <g filter="url(#badgeshadow)">
    <rect x="1185" y="740" width="290" height="100" rx="26" fill="#0D1A2C" stroke="#E63946" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(1212,764)" fill="none" stroke="#E63946" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 1.5 22 5v7c0 6-4 10.3-9 12-5-1.7-9-6-9-12V5l9-3.5z"/>
    <path d="M9.2 12.5l2.6 2.6 5-5"/>
  </g>
  <text x="1250" y="782" fill="#FFFFFF" font-size="23" font-weight="700">Calidad y confianza</text>
  <text x="1250" y="812" fill="#B9C2CF" font-size="21">en cada producto</text>
</svg>
